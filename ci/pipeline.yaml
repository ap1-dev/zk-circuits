resource_types: []

# ---------------------------------------------------------------------------
# Resources
#
#   - `repo`  : the source git checkout (circom files + shared ptau keys).
#   - `s3` resources (one per circuit): store the compiled circuit artifacts
#     (.wasm, final.zkey, verification_key.json) consumed by the proof job.
# ---------------------------------------------------------------------------

s3_source: &s3_source
  bucket: ((s3_bucket))
  endpoint: ((s3_endpoint))
  access_key_id: ((s3_access_key_id))
  secret_access_key: ((s3_secret_access_key))
  region_name: ((s3_region))
  disable_ssl: ((s3_disable_ssl))

resources:
  - name: repo
    type: git
    icon: github
    source:
      uri: ((repo_uri))
      branch: ((repo_branch))
      private_key: ((git_private_key))

  # ---- per-circuit artifact buckets ----------------------------------------
  # Fixed paths, overwritten on every build. Downstream proof jobs get the
  # latest compiled artifacts by pulling these fixed keys.

  - name: artifacts-f-source
    type: s3
    icon: archive
    source:
      <<: *s3_source
      versioned_file: circuits/f_source/f_source-artifacts.tgz

  - name: artifacts-f-artifact
    type: s3
    icon: archive
    source:
      <<: *s3_source
      versioned_file: circuits/f_artifact/f_artifact-artifacts.tgz

  - name: artifacts-f-build
    type: s3
    icon: archive
    source:
      <<: *s3_source
      versioned_file: circuits/f_build/f_build-artifacts.tgz

  - name: artifacts-f-test
    type: s3
    icon: archive
    source:
      <<: *s3_source
      versioned_file: circuits/f_test/f_test-artifacts.tgz

  - name: artifacts-f-deps-membership
    type: s3
    icon: archive
    source:
      <<: *s3_source
      versioned_file: circuits/f_deps_membership/f_deps_membership-artifacts.tgz


jobs:
  - name: compile-circuits
    serial: true
    plan:
      - get: repo
        trigger: true

      - task: compile-all-circuits
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ((zk_image_repository))
              tag: ((zk_image_tag))

          inputs:
            - name: repo

          outputs:
            - name: circuit-artifacts   # flat staging dir; sub-dirs per circuit

          run:
            path: bash
            args:
              - repo/ci/compile-circuits.bash

      # ---- push per-circuit bundles to S3 ------------------------------------

      - put: artifacts-f-source
        params:
          file: circuit-artifacts/f_source/f_source-artifacts.tgz

      - put: artifacts-f-artifact
        params:
          file: circuit-artifacts/f_artifact/f_artifact-artifacts.tgz

      - put: artifacts-f-build
        params:
          file: circuit-artifacts/f_build/f_build-artifacts.tgz

      - put: artifacts-f-test
        params:
          file: circuit-artifacts/f_test/f_test-artifacts.tgz

      - put: artifacts-f-deps-membership
        params:
          file: circuit-artifacts/f_deps_membership/f_deps_membership-artifacts.tgz
