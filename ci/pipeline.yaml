resource_types: []

# ---------------------------------------------------------------------------
# Resources
#
#   - `circuit-repo` : the source git checkout (circom files + shared ptau keys).
#   - `src-repo`     : the application source repo built inside the TEE.
#   - `s3` resources (one per circuit): store the compiled circuit artifacts
#     (.wasm, final.zkey, verification_key.json) consumed by the proof job.
# ---------------------------------------------------------------------------

s3_source: &s3_source
  bucket: ((s3_bucket))
  endpoint: ((s3_endpoint))
  access_key_id: ((s3_access_key_id))
  secret_access_key: ((s3_secret_access_key))
  region_name: ((s3_region))
  disable_ssl: ((s3_disable_ssl))

resources:
  - name: circuit-repo
    type: git
    icon: github
    source:
      uri: ((circuit_repo_uri))
      branch: ((circuit_repo_branch))
      private_key: ((circuit_repo_private_key))

  - name: src-repo
    type: git
    icon: github
    source:
      uri: ((src_repo_uri))
      branch: ((src_repo_branch))
      private_key: ((src_repo_private_key))

  # ---- per-circuit artifact buckets ----------------------------------------
  # Filenames embed the Concourse build number (BUILD_NAME) as the version
  # string, e.g. f_source-artifacts-42.tgz. No S3 bucket versioning needed.

  - name: artifacts-f-source
    type: s3
    icon: archive
    source:
      <<: *s3_source
      regexp: circuits/f_source/f_source-artifacts-([0-9]+).tgz

  - name: artifacts-f-artifact
    type: s3
    icon: archive
    source:
      <<: *s3_source
      regexp: circuits/f_artifact/f_artifact-artifacts-([0-9]+).tgz

  - name: artifacts-f-build
    type: s3
    icon: archive
    source:
      <<: *s3_source
      regexp: circuits/f_build/f_build-artifacts-([0-9]+).tgz

  - name: artifacts-f-test
    type: s3
    icon: archive
    source:
      <<: *s3_source
      regexp: circuits/f_test/f_test-artifacts-([0-9]+).tgz

  - name: artifacts-f-deps-membership
    type: s3
    icon: archive
    source:
      <<: *s3_source
      regexp: circuits/f_deps_membership/f_deps_membership-artifacts-([0-9]+).tgz


jobs:
  - name: compile-circuits
    serial: true
    plan:
      - get: circuit-repo
        trigger: false

      - task: compile-all-circuits
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ((zk_image_repository))
              tag: ((zk_image_tag))

          inputs:
            - name: circuit-repo

          outputs:
            - name: circuit-artifacts

          run:
            path: bash
            args:
              - circuit-repo/ci/compile-circuits.bash

      # ---- push per-circuit bundles to S3 ------------------------------------

      - put: artifacts-f-source
        params:
          file: circuit-artifacts/f_source/f_source-artifacts-*.tgz

      - put: artifacts-f-artifact
        params:
          file: circuit-artifacts/f_artifact/f_artifact-artifacts-*.tgz

      - put: artifacts-f-build
        params:
          file: circuit-artifacts/f_build/f_build-artifacts-*.tgz

      - put: artifacts-f-test
        params:
          file: circuit-artifacts/f_test/f_test-artifacts-*.tgz

      - put: artifacts-f-deps-membership
        params:
          file: circuit-artifacts/f_deps_membership/f_deps_membership-artifacts-*.tgz

  # ---------------------------------------------------------------------------
  # Job: build-and-prove
  #
  # Task 1 (build-tee):  builds the app inside the TEE enclave using src-repo,
  #                      emitting a private witness (tee-build/).
  # Task 2 (zk-proof):   consumes the witness + compiled circuit artifacts to
  #                      generate ZK proofs.
  # ---------------------------------------------------------------------------

  - name: build-and-prove
    serial: true
    plan:
      - get: circuit-repo
        trigger: false

      - get: src-repo
        trigger: false

      - get: artifacts-f-source
        passed: [compile-circuits]

      - get: artifacts-f-artifact
        passed: [compile-circuits]

      - get: artifacts-f-build
        passed: [compile-circuits]

      - get: artifacts-f-test
        passed: [compile-circuits]

      - get: artifacts-f-deps-membership
        passed: [compile-circuits]

      # ------------------------------------------------------------------
      # Task 1: build-tee
      # Runs tee_build.js against src-repo, writes private witness files
      # into the `tee-build` output volume.
      # ------------------------------------------------------------------
      - task: build-tee
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ((tee_image_repository))
              tag: latest

          inputs:
            - name: circuit-repo
            - name: src-repo

          outputs:
            - name: tee-build
            # tee-build layout written by tee_build.js:
            #   tee-build/build_log.json
            #   tee-build/final_build_summary.json
            #   tee-build/pvt-witness/*

          params:
            REPO_DIR: src-repo
            OUT_DIR: tee-build
            S3_OUT_DIR: tee-build/s3-output
            VCPKG_ROOT: /opt/vcpkg
            VCPKG_INSTALLED_DIR: /opt/vcpkg-installed

          run:
            path: bash
            args:
              - -c
              - |
                npm install --prefer-offline --no-audit --no-fund --prefix circuit-repo/ci/scripts
                node circuit-repo/ci/scripts/tee_build.js

      # ------------------------------------------------------------------
      # Task 2: zk-proof
      # Consumes the private witness from tee-build and the compiled
      # circuit artifacts to generate ZK proofs.
      # ------------------------------------------------------------------
      - task: zk-proof
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ((zk_image_repository))
              tag: ((zk_image_tag))

          inputs:
            - name: circuit-repo
            - name: tee-build
            - name: artifacts-f-source
            - name: artifacts-f-artifact
            - name: artifacts-f-build
            - name: artifacts-f-test
            - name: artifacts-f-deps-membership

          outputs:
            - name: zk-proofs

          run:
            path: bash
            args:
              - -c
              - |
                node circuit-repo/ci/scripts/zk-proof.js
